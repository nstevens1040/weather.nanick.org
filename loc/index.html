            function calculateGpsDistance(destinationCoordinates) {
                var originCoordinates = src_coords_obj;

                var radiansInOneDegree = Math.PI / 180;
                var earthRadius = 3963.19;
                var lat1 = originCoordinates.lat * radiansInOneDegree;
                var lon1 = originCoordinates.lng * radiansInOneDegree;
                var lat2 = destinationCoordinates.lat * radiansInOneDegree;
                var lon2 = destinationCoordinates.lng * radiansInOneDegree;
                var lat_diff = lat2 - lat1;

                var a = Math.pow(Math.sin((lat_diff / 2), 2)) + Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin(lon_diff / 2), 2);

                return d;
            }
